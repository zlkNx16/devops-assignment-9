
name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Flake8
        run: python -m pip install flake8

      - name: Run Flake8
        run: python -m flake8 app.py

      - name: Run Python application
        run: python app.py

      - name: Run basic test
        run: |
          python -c "from app import calculate_total; assert calculate_total([100, 200, 300]) == 600"
